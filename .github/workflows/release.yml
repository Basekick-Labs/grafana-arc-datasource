name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Job-level env because the `secrets` context is not available in step
    # `if:` expressions; the sign step gates on `env` instead.
    env:
      GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Fail fast before the multi-minute build if the tag doesn't match the
      # plugin version.
      - name: Check tag matches plugin version
        run: |
          PLUGIN_VERSION=$(jq -r .info.version plugin.json)
          TAG="${GITHUB_REF#refs/*/}"
          if [ "v${PLUGIN_VERSION}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match plugin.json version ${PLUGIN_VERSION}"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Mage
        run: go install github.com/magefile/mage@latest

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm run test:ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Test backend
        run: go test ./...

      # Order matters: `npm run build` wipes dist/ (webpack output.clean),
      # so backend binaries are built after. The Magefile writes flat
      # dist/<executable>_<os>_<arch> paths per Grafana SDK loader expectations.
      - name: Build backend
        run: mage -v buildAll

      # Signs when the GRAFANA_ACCESS_POLICY_TOKEN repo secret is configured
      # AND the PLUGIN_SIGNING_ENABLED repository variable is 'true'.
      # The variable gate exists because community signing only works after
      # Grafana has approved the plugin's initial catalog submission; before
      # that the signing API returns 409 "Field is required: rootUrls" (it
      # only offers a private signature for unknown plugin ids), and the
      # first submission is expected to be unsigned anyway. Flip the variable
      # on once the plugin is in the catalog; from then on a signing failure
      # fails the release loudly instead of shipping unsigned.
      - name: Sign plugin
        if: ${{ env.GRAFANA_ACCESS_POLICY_TOKEN != '' && vars.PLUGIN_SIGNING_ENABLED == 'true' }}
        run: npm run sign

      - name: Get plugin metadata
        id: metadata
        run: |
          export GRAFANA_PLUGIN_ID=$(cat dist/plugin.json | jq -r .id)
          export GRAFANA_PLUGIN_VERSION=$(cat dist/plugin.json | jq -r .info.version)
          export GRAFANA_PLUGIN_TYPE=$(cat dist/plugin.json | jq -r .type)
          export GRAFANA_PLUGIN_ARTIFACT=${GRAFANA_PLUGIN_ID}-${GRAFANA_PLUGIN_VERSION}.zip
          export GRAFANA_PLUGIN_ARTIFACT_SHA1SUM=${GRAFANA_PLUGIN_ARTIFACT}.sha1

          echo "plugin-id=${GRAFANA_PLUGIN_ID}" >> $GITHUB_OUTPUT
          echo "plugin-version=${GRAFANA_PLUGIN_VERSION}" >> $GITHUB_OUTPUT
          echo "plugin-type=${GRAFANA_PLUGIN_TYPE}" >> $GITHUB_OUTPUT
          echo "archive=${GRAFANA_PLUGIN_ARTIFACT}" >> $GITHUB_OUTPUT
          echo "archive-sha1sum=${GRAFANA_PLUGIN_ARTIFACT_SHA1SUM}" >> $GITHUB_OUTPUT

          echo "github-tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: Package plugin
        id: package-plugin
        run: |
          mv dist ${{ steps.metadata.outputs.plugin-id }}
          zip ${{ steps.metadata.outputs.archive }} ${{ steps.metadata.outputs.plugin-id }} -r
          # Keep the `hash  filename` format so `sha1sum -c` accepts the file.
          sha1sum ${{ steps.metadata.outputs.archive }} > ${{ steps.metadata.outputs.archive-sha1sum }}
          echo "checksum=$(cut -f1 -d' ' ./${{ steps.metadata.outputs.archive-sha1sum }})" >> $GITHUB_OUTPUT

      - name: Validate plugin
        run: |
          git clone --depth 1 https://github.com/grafana/plugin-validator
          pushd ./plugin-validator/pkg/cmd/plugincheck2
          go install
          popd
          plugincheck2 -config ./plugin-validator/config/default.yaml ${{ steps.metadata.outputs.archive }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          generate_release_notes: true
          files: |
            ./${{ steps.metadata.outputs.archive }}
            ./${{ steps.metadata.outputs.archive-sha1sum }}
          body: |
            **This is a draft release. Please update the release notes before publishing.**

            ## Installation

            Download and extract the plugin archive to your Grafana plugins directory:

            ```bash
            wget https://github.com/basekick-labs/grafana-arc-datasource/releases/download/${{ steps.metadata.outputs.github-tag }}/${{ steps.metadata.outputs.archive }}
            unzip ${{ steps.metadata.outputs.archive }} -d /var/lib/grafana/plugins/
            systemctl restart grafana-server
            ```

            ## What's Changed

            See CHANGELOG.md for details.

            ## Checksums

            - SHA1: `${{ steps.package-plugin.outputs.checksum }}`
