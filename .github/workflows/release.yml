# This GitHub Action automates the process of building Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The policy_token is passed only when the PLUGIN_SIGNING_ENABLED
      # repository variable is 'true': community signing requires the plugin
      # to already exist in the Grafana catalog, and before first approval
      # the signing API rejects with 409 "Field is required: rootUrls".
      # Flip the variable on after Grafana approves the initial submission.
      - uses: grafana/plugin-actions/build-plugin@build-plugin/v1.2.0
        with:
          policy_token: ${{ vars.PLUGIN_SIGNING_ENABLED == 'true' && secrets.GRAFANA_ACCESS_POLICY_TOKEN || '' }}
          # The action's default is Go 1.25 with GOTOOLCHAIN=local; go.mod
          # (via the plugin SDK) requires 1.26.5+.
          go-version: '1.26.5'
